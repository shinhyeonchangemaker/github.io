<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 분리배출 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first — square camera frame, one result card that changes color by 수거함, search fallback below */
:root {
  --bg: #F1F5F2; --surface: #FFFFFF; --ink: #17211C; --muted: #56655D; --line: #D3DDD7;
  --accent: #1E7149; --accent-ink: #FFFFFF;
  --plastic: #2C68AB; --can: #5E6873; --paper: #9A6631; --general: #33393F; --bin-ink: #FFFFFF;
  --unsure-bg: #FFF4D6; --unsure-ink: #6B4E00; --unsure-line: #E9C96A;
  --warn-bg: #F6E7E5; --warn-ink: #9C3A2E; --focus: #1E7149;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111814; --surface: #1A231E; --ink: #E6EEE9; --muted: #9FB0A6; --line: #2E3A33;
    --accent: #5CC28E; --accent-ink: #0E1A13;
    --plastic: #4C86C8; --can: #7D8792; --paper: #B98447; --general: #4A5259;
    --unsure-bg: #3A3016; --unsure-ink: #F2D27A; --unsure-line: #7A6420;
    --warn-bg: #3A2320; --warn-ink: #F0A396; --focus: #5CC28E;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
}
.wrap {
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); margin: 0 0 4px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 9vw, 48px); line-height: 1.1; margin: 0; text-wrap: balance; }
.lede { margin: 8px 0 0; color: var(--muted); }

.notice { padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: 15px; }
.notice b { display: block; }
.notice .err { display: block; margin-top: 6px; font-size: 12px; opacity: 0.85; word-break: break-all; }

.frame {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1;
  border-radius: 14px; overflow: hidden; background: #0E1411;
}
.frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
.guide {
  position: absolute; inset: 16%; border: 3px dashed rgba(255,255,255,0.75); border-radius: 18px; pointer-events: none;
}
.start {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  padding: 14px 26px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink);
}
.start:disabled { opacity: 0.5; cursor: default; }
.start:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }

.result { border-radius: 14px; padding: 18px; min-height: 132px; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.result.idle { background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.result.sure { background: var(--bin); color: var(--bin-ink); }
.result.unsure { background: var(--unsure-bg); color: var(--unsure-ink); border: 2px solid var(--unsure-line); }
.result .big { font-family: var(--display); font-size: 30px; line-height: 1.15; margin: 0; }
.result p { margin: 0; }
.result .meta { font-size: 13px; opacity: 0.85; font-variant-numeric: tabular-nums; }
.btn {
  align-self: flex-start; margin-top: 6px; text-decoration: none; font-weight: 700; font-size: 15px;
  padding: 10px 14px; border-radius: 8px; border: 2px solid currentColor; color: inherit;
}
.btn:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

.search-link { color: var(--accent); font-weight: 700; text-align: center; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
footer p { margin: 0 0 4px; }
</style>
</head>
<body>
<main class="wrap">
  <section>
    <p class="eyebrow">신현고 체인지 메이커 - 분리배출 스테이션 · AI 도우미</p>
    <h1>카메라에 비춰 보세요</h1>
    <p class="lede">물건 하나를 점선 안에 비추면 어느 수거함에 넣을지 알려줘요. AI가 확실하지 않을 때는 검색으로 안내해요.</p>
  </section>

  <div class="notice" id="notice" role="alert" hidden></div>

  <section class="frame" aria-label="카메라 화면">
    <video id="video" playsinline muted autoplay></video>
    <div class="guide" aria-hidden="true"></div>
    <button class="start" id="start" type="button">카메라 켜기</button>
  </section>

  <section class="result idle" id="result" aria-live="polite">
    <p>카메라 켜기를 누르면 시작해요.</p>
  </section>

  <a class="search-link" id="searchLink" href="#">AI 없이 직접 검색하기</a>

  <footer>
    <p>체인지메이커 분리배출 스테이션 프로젝트</p>
    <p>AI 판정은 틀릴 수 있어요.</p>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
/* ==================== 설정: 여기만 고치면 돼요 ==================== */
const CONFIG = {
  // 티처블머신 → 모델 내보내기 → 업로드 후 받은 공유 링크
  MODEL_URL: "https://teachablemachine.withgoogle.com/models/z-JGGoFHE/",
  // 확신이 없을 때 연결할 「이거 어디 버려?」 안내 페이지 (같은 사이트의 index.html)
  GUIDE_URL: "./",
  // 이 값 이상일 때만 결과를 보여줘요 (0.80 = 80%)
  THRESHOLD: 0.80,
  // 최근 몇 번의 판정을 평균 낼지 (클수록 안정적, 반응은 느려짐)
  SMOOTH_FRAMES: 8,
  // 판정 간격(밀리초)
  INTERVAL_MS: 150,
  // 학습 사진이 좌우반전되어 정확도가 이상하게 낮으면 true로 바꿔 보세요
  FLIP: false
};

// 티처블머신 클래스 이름 → 수거함 연결 (클래스 이름을 정확히 똑같이 적어 주세요)
// 문자열 대신 { bin: "plastic", tip: "..." }로 쓰면 그 클래스만의 안내 문구를 넣을 수 있어요
// "unsure"로 연결하면 그 클래스는 항상 '확실하지 않아요'로 안내해요
// 띄어쓰기 · 쉼표가 조금 달라도 알아봐요
const CLASS_MAP = {
  "플라스틱": "plastic",
  "종이류": "paper",
  "캔, 고철": "can",
  "일반 쓰레기": "general",
  "모르겠다": "unsure",
  "없음": "none"   // 나중에 '없음'(빈 화면) 클래스를 추가하면 자동으로 쓰여요
};
/* ================================================================ */

// <logic>
const BINS = {
  plastic: { name: "플라스틱", color: "var(--plastic)", tip: "내용물 비우고 헹군 뒤, 라벨 떼고 찌그러뜨려서" },
  can:     { name: "캔 · 고철", color: "var(--can)", tip: "끝까지 비우고 납작하게 찌그러뜨려서" },
  paper:   { name: "종이류", color: "var(--paper)", tip: "테이프·스프링 떼기. 우유팩·종이컵은 헹궈서 따로" },
  general: { name: "일반쓰레기", color: "var(--general)", tip: "재활용함에는 넣지 말아 주세요" }
};

// CLASS_MAP에 없는 이름은 낱말로 추측해요
const KEYWORDS = [
  ["unsure", ["모르"]],
  ["none", ["없음", "배경"]],
  ["plastic", ["플라스틱", "페트"]],
  ["can", ["캔", "고철", "금속"]],
  ["paper", ["종이", "팩", "박스"]],
  ["general", ["일반"]]
];

const squash = (t) => String(t).replace(/[\s,·.]/g, "").toLowerCase();

function resolveLabel(label, classMap) {
  let raw = classMap[label];
  if (raw === undefined) {
    const k = Object.keys(classMap).find(key => squash(key) === squash(label));
    if (k) raw = classMap[k];
  }
  if (typeof raw === "string") return { bin: raw, tip: null };
  if (raw && raw.bin) return { bin: raw.bin, tip: raw.tip || null };
  const l = String(label).toLowerCase();
  for (const [bin, words] of KEYWORDS) {
    if (words.some(w => l.includes(w))) return { bin, tip: null };
  }
  return null; // 연결할 수거함을 모름 → 확신 없음으로 처리
}

function averageHistory(history) {
  const n = history.length, k = history[0].length;
  const avg = new Array(k).fill(0);
  for (const row of history) for (let i = 0; i < k; i++) avg[i] += row[i] / n;
  return avg;
}

function decide(avg, labels, classMap, threshold) {
  let top = 0;
  for (let i = 1; i < avg.length; i++) if (avg[i] > avg[top]) top = i;
  const p = avg[top];
  const hit = resolveLabel(labels[top], classMap);
  if (hit && hit.bin === "none") return { state: "empty", p };
  if (!hit || !BINS[hit.bin]) return { state: "unsure", p };
  if (p >= threshold) return { state: "sure", bin: hit.bin, tip: hit.tip || BINS[hit.bin].tip, label: labels[top], p };
  return { state: "unsure", p };
}
// </logic>

const $ = (id) => document.getElementById(id);
const video = $("video"), startBtn = $("start"), resultEl = $("result"), notice = $("notice");
let model = null, labels = [], history = [], running = false, timer = null, lastKey = "";

$("searchLink").href = CONFIG.GUIDE_URL;

function showNotice(title, text) {
  notice.innerHTML = `<b>${title}</b>${text}`;
  notice.hidden = false;
}

function pct(p) { return Math.round(p * 100) + "%"; }

function render(r) {
  const key = r.state + ":" + (r.bin || "") + ":" + (r.label || "");
  const meta = `AI 확신도 ${pct(r.p)} · 기준 ${pct(CONFIG.THRESHOLD)}`;
  if (key === lastKey) {
    const m = resultEl.querySelector(".meta");
    if (m) m.textContent = meta;
    return;
  }
  lastKey = key;
  if (r.state === "sure") {
    const b = BINS[r.bin];
    resultEl.className = "result sure";
    resultEl.style.setProperty("--bin", b.color);
    resultEl.innerHTML = `<p class="big">${b.name}함에 넣어요</p>
      <p>${r.tip}</p>
      <p class="meta">${meta}</p>
      <a class="btn" href="${CONFIG.GUIDE_URL}#${r.bin}">이 수거함 안내 자세히 보기</a>`;
  } else if (r.state === "unsure") {
    resultEl.className = "result unsure";
    resultEl.innerHTML = `<p class="big">확실하지 않아요</p>
      <p>잘못 버리는 것보다 확인하는 게 나아요. 검색으로 확인해 주세요.</p>
      <p class="meta">${meta}</p>
      <a class="btn" href="${CONFIG.GUIDE_URL}">「이거 어디 버려?」에서 검색하기</a>`;
  } else {
    resultEl.className = "result idle";
    resultEl.innerHTML = `<p>물건 하나를 점선 안에 비춰 주세요.</p>`;
  }
}

function normalizeUrl(u) { return u.endsWith("/") ? u : u + "/"; }

async function loadModel() {
  if (!/^https:\/\/teachablemachine\.withgoogle\.com\/models\//.test(CONFIG.MODEL_URL)) {
    showNotice("설정이 필요해요", "CONFIG의 MODEL_URL에 티처블머신 공유 링크를 붙여 넣어 주세요.");
    startBtn.disabled = true;
    return false;
  }
  if (typeof tmImage === "undefined") {
    showNotice("AI 도구를 불러오지 못했어요", "인터넷 연결을 확인하고 새로고침해 주세요.");
    startBtn.disabled = true;
    return false;
  }
  const base = normalizeUrl(CONFIG.MODEL_URL);
  const tryLoad = () => tmImage.load(base + "model.json", base + "metadata.json");
  try {
    model = await tryLoad();
  } catch (e1) {
    // 휴대폰 그래픽(WebGL) 문제일 수 있어 CPU 방식으로 한 번 더 시도
    try {
      if (typeof tf !== "undefined") { await tf.setBackend("cpu"); await tf.ready(); }
      model = await tryLoad();
    } catch (e2) {
      const detail = String((e2 && e2.message) || (e1 && e1.message) || e2 || e1).slice(0, 160);
      showNotice("모델을 불러오지 못했어요",
        "공유 링크가 맞는지, 티처블머신에서 모델을 업로드했는지 확인해 주세요." +
        `<span class="err">오류 내용: ${detail.replace(/</g, "&lt;")}</span>`);
      startBtn.disabled = true;
      return false;
    }
  }
  labels = model.getClassLabels();
  return true;
}

async function startCamera() {
  startBtn.disabled = true;
  startBtn.textContent = "준비 중…";
  if (!model && !(await modelReady)) { startBtn.textContent = "카메라 켜기"; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 640 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    startBtn.hidden = true;
    notice.hidden = true;
    running = true;
    render({ state: "empty", p: 0 });
    tick();
  } catch (e) {
    startBtn.disabled = false;
    startBtn.textContent = "다시 시도";
    showNotice("카메라를 켜지 못했어요", "브라우저 설정에서 이 페이지의 카메라 사용을 허용한 뒤 다시 눌러 주세요.");
  }
}

async function tick() {
  if (!running) return;
  try {
    if (video.readyState >= 2) {
      const preds = await model.predict(video, CONFIG.FLIP);
      history.push(preds.map(x => x.probability));
      if (history.length > CONFIG.SMOOTH_FRAMES) history.shift();
      render(decide(averageHistory(history), labels, CLASS_MAP, CONFIG.THRESHOLD));
    }
  } catch (e) { /* 한 번 실패해도 다음 판정에서 다시 시도 */ }
  timer = setTimeout(tick, CONFIG.INTERVAL_MS);
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { running = false; clearTimeout(timer); }
  else if (video.srcObject && model) { running = true; history = []; tick(); }
});

const modelReady = loadModel();
startBtn.addEventListener("click", startCamera);
</script>
</body>
</html>
